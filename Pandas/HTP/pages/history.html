<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OCR History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            OCR Processing History
        </h2>

        <!-- Search & Filter -->

        <div class="dashboard-card mb-4">

            <div class="row">

                <div class="col-md-6">

                    <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search file name...">

                </div>

                <div class="col-md-4">

                    <input
                    type="date"
                    id="dateFilter"
                    class="form-control">

                </div>

                <div class="col-md-2">

                    <button
                    class="btn btn-primary w-100"
                    onclick="filterHistory()">

                    Filter

                    </button>

                </div>

            </div>

        </div>

        <!-- History Table -->

        <div class="dashboard-card">

            <div class="table-responsive">

                <table
                class="table table-dark table-hover">

                    <thead>

                    <tr>

                        <th>Date</th>
                        <th>File</th>
                        <th>Language</th>
                        <th>Accuracy</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="historyTable">

                    <tr>

                        <td>25-09-2026</td>
                        <td>notes.jpg</td>
                        <td>English</td>
                        <td>97%</td>

                        <td>

                            <button
                            class="btn btn-info btn-sm">

                            View

                            </button>

                            <button
                            class="btn btn-success btn-sm">

                            Download

                            </button>

                            <button
                            class="btn btn-danger btn-sm">

                            Delete

                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>24-09-2026</td>
                        <td>telugu.png</td>
                        <td>Telugu</td>
                        <td>95%</td>

                        <td>

                            <button
                            class="btn btn-info btn-sm">

                            View

                            </button>

                            <button
                            class="btn btn-success btn-sm">

                            Download

                            </button>

                            <button
                            class="btn btn-danger btn-sm">

                            Delete

                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>23-09-2026</td>
                        <td>document.pdf</td>
                        <td>Hindi</td>
                        <td>96%</td>

                        <td>

                            <button
                            class="btn btn-info btn-sm">

                            View

                            </button>

                            <button
                            class="btn btn-success btn-sm">

                            Download

                            </button>

                            <button
                            class="btn btn-danger btn-sm">

                            Delete

                            </button>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script>

function filterHistory(){

const search =
document.getElementById(
"searchInput"
).value;

alert(
"Searching for: " + search
);

}

</script>

</body>

</html>
