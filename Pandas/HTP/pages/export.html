<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Export Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="translation.html">Translation</a></li>
            <li><a href="export.html">Export</a></li>
        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            Export OCR Results
        </h2>

        <!-- Summary -->

        <div class="dashboard-card">

            <h4>Recognition Summary</h4>

            <p><strong>File:</strong> notes.jpg</p>
            <p><strong>Language:</strong> English</p>
            <p><strong>Accuracy:</strong> 97%</p>
            <p><strong>Status:</strong> Completed</p>

        </div>

        <!-- Export Options -->

        <div class="row mt-4">

            <div class="col-md-4">

                <div class="dashboard-card text-center">

                    <i class="bi bi-file-earmark-text display-4"></i>

                    <h4 class="mt-3">
                        TXT
                    </h4>

                    <button
                    class="btn btn-primary"
                    onclick="downloadTXT()">

                    Download TXT

                    </button>

                </div>

            </div>

            <div class="col-md-4">

                <div class="dashboard-card text-center">

                    <i class="bi bi-file-earmark-pdf display-4"></i>

                    <h4 class="mt-3">
                        PDF
                    </h4>

                    <button
                    class="btn btn-danger"
                    onclick="downloadPDF()">

                    Download PDF

                    </button>

                </div>

            </div>

            <div class="col-md-4">

                <div class="dashboard-card text-center">

                    <i class="bi bi-file-earmark-word display-4"></i>

                    <h4 class="mt-3">
                        DOCX
                    </h4>

                    <button
                    class="btn btn-success"
                    onclick="downloadDOCX()">

                    Download DOCX

                    </button>

                </div>

            </div>

        </div>

        <!-- Status -->

        <div
        id="exportStatus"
        class="alert alert-success mt-4"
        style="display:none;">

        File exported successfully.

        </div>

        <!-- Navigation -->

        <div class="mt-4">

            <a
            href="dashboard.html"
            class="btn btn-info">

            Back to Dashboard

            </a>

        </div>

    </main>

</div>

<script>

function showStatus(){

document.getElementById(
"exportStatus"
).style.display="block";

setTimeout(()=>{

document.getElementById(
"exportStatus"
).style.display="none";

},3000);

}

function downloadTXT(){

const content =
"Sample OCR Text Export";

const blob =
new Blob([content],
{type:"text/plain"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"ocr-result.txt";

link.click();

showStatus();

}

function downloadPDF(){

alert(
"PDF Export Demo"
);

showStatus();

}

function downloadDOCX(){

alert(
"DOCX Export Demo"
);

showStatus();

}

</script>

</body>
</html>
