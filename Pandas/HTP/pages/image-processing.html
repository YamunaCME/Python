<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Image Processing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="upload-image.html">Upload</a></li>
            <li><a href="image-processing.html">Processing</a></li>
            <li><a href="ocr-recognition.html">OCR</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            Image Processing
        </h2>

        <div class="row">

            <!-- Image Preview -->

            <div class="col-lg-7">

                <div class="dashboard-card">

                    <img
                    id="processImage"
                    src="https://via.placeholder.com/800x500"
                    class="img-fluid rounded">

                </div>

            </div>

            <!-- Controls -->

            <div class="col-lg-5">

                <div class="dashboard-card">

                    <h5>Image Tools</h5>

                    <button
                    class="btn btn-primary m-1"
                    onclick="zoomIn()">

                    Zoom In

                    </button>

                    <button
                    class="btn btn-primary m-1"
                    onclick="zoomOut()">

                    Zoom Out

                    </button>

                    <button
                    class="btn btn-warning m-1"
                    onclick="rotateLeft()">

                    Rotate Left

                    </button>

                    <button
                    class="btn btn-warning m-1"
                    onclick="rotateRight()">

                    Rotate Right

                    </button>

                    <hr>

                    <label>
                    Brightness
                    </label>

                    <input
                    type="range"
                    min="50"
                    max="200"
                    value="100"
                    id="brightness"
                    class="form-range">

                    <label>
                    Contrast
                    </label>

                    <input
                    type="range"
                    min="50"
                    max="200"
                    value="100"
                    id="contrast"
                    class="form-range">

                    <label>
                    Noise Reduction
                    </label>

                    <input
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    class="form-range">

                    <div class="mt-4">

                        <button
                        class="btn btn-success"
                        onclick="applyFilters()">

                        Apply

                        </button>

                        <button
                        class="btn btn-danger"
                        onclick="resetImage()">

                        Reset

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="mt-4">

            <a
            href="ocr-recognition.html"
            class="btn btn-info">

            Continue to OCR →

            </a>

        </div>

    </main>

</div>

<script>

let scale = 1;
let rotate = 0;

const image =
document.getElementById("processImage");

function zoomIn(){

scale += 0.1;

image.style.transform =
`scale(${scale}) rotate(${rotate}deg)`;

}

function zoomOut(){

scale -= 0.1;

image.style.transform =
`scale(${scale}) rotate(${rotate}deg)`;

}

function rotateLeft(){

rotate -= 90;

image.style.transform =
`scale(${scale}) rotate(${rotate}deg)`;

}

function rotateRight(){

rotate += 90;

image.style.transform =
`scale(${scale}) rotate(${rotate}deg)`;

}

function applyFilters(){

const brightness =
document.getElementById("brightness").value;

const contrast =
document.getElementById("contrast").value;

image.style.filter =

`brightness(${brightness}%)
 contrast(${contrast}%)`;

}

function resetImage(){

scale = 1;
rotate = 0;

image.style.transform =
"scale(1) rotate(0deg)";

image.style.filter =
"brightness(100%) contrast(100%)";

}

</script>

</body>
</html>
