<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OCR Recognition</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="upload-image.html">Upload</a></li>
            <li><a href="image-processing.html">Image Processing</a></li>
            <li><a href="ocr-recognition.html">OCR Recognition</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            OCR Recognition
        </h2>

        <div class="dashboard-card">

            <h5>Select Recognition Language</h5>

            <select
            id="language"
            class="form-select mb-3">

                <option>Auto Detect</option>
                <option>English</option>
                <option>Telugu</option>
                <option>Hindi</option>

            </select>

            <button
            class="btn btn-primary"
            onclick="startOCR()">

            Start Recognition

            </button>

        </div>

        <!-- Loading Section -->

        <div
        id="loadingSection"
        class="text-center mt-5"
        style="display:none;">

            <div
            class="spinner-border text-info"
            role="status">
            </div>

            <h5 class="mt-3">
                Processing OCR...
            </h5>

        </div>

        <!-- Progress -->

        <div
        class="progress mt-4">

            <div
            id="ocrProgress"
            class="progress-bar progress-bar-striped progress-bar-animated"
            style="width:0%">

            0%

            </div>

        </div>

        <!-- Result -->

        <div
        id="resultSection"
        class="dashboard-card mt-4"
        style="display:none;">

            <div class="d-flex justify-content-between">

                <h4>
                    Recognition Result
                </h4>

                <span
                class="badge bg-success">

                Accuracy: 97%

                </span>

            </div>

            <textarea
            id="recognizedText"
            class="form-control mt-3"
            rows="10">

This is a sample OCR result.
Handwritten text has been converted into digital text successfully.

            </textarea>

            <div class="mt-3">

                <button
                class="btn btn-success"
                onclick="copyText()">

                Copy Text

                </button>

                <button
                class="btn btn-warning"
                onclick="downloadText()">

                Download TXT

                </button>

            </div>

        </div>

        <!-- Navigation -->

        <div class="mt-4">

            <a
            href="text-editor.html"
            class="btn btn-info">

            Continue to Text Editor →

            </a>

        </div>

    </main>

</div>

<script>

function startOCR(){

document.getElementById(
"loadingSection"
).style.display="block";

let progress = 0;

const bar =
document.getElementById(
"ocrProgress"
);

const interval =
setInterval(()=>{

progress += 10;

bar.style.width =
progress + "%";

bar.innerText =
progress + "%";

if(progress >= 100){

clearInterval(interval);

document.getElementById(
"loadingSection"
).style.display="none";

document.getElementById(
"resultSection"
).style.display="block";

}

},300);

}

function copyText(){

const text =
document.getElementById(
"recognizedText"
);

text.select();

document.execCommand("copy");

alert(
"Text Copied Successfully"
);

}

function downloadText(){

const text =
document.getElementById(
"recognizedText"
).value;

const blob =
new Blob([text],
{type:"text/plain"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"ocr-result.txt";

link.click();

}

</script>

</body>
</html>
