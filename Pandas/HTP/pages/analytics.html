<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Analytics Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="history.html">History</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            OCR Analytics Dashboard
        </h2>

        <!-- Statistics Cards -->

        <div class="row g-4">

            <div class="col-md-3">

                <div class="dashboard-card text-center">

                    <h5>Total Documents</h5>

                    <h2>2,540</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card text-center">

                    <h5>Accuracy</h5>

                    <h2>97%</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card text-center">

                    <h5>Languages</h5>

                    <h2>3</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card text-center">

                    <h5>Today's OCR</h5>

                    <h2>152</h2>

                </div>

            </div>

        </div>

        <!-- Accuracy Chart -->

        <div class="dashboard-card mt-5">

            <h4>
                OCR Accuracy Trend
            </h4>

            <canvas id="accuracyChart"></canvas>

        </div>

        <!-- Usage Chart -->

        <div class="dashboard-card mt-5">

            <h4>
                Daily OCR Usage
            </h4>

            <canvas id="usageChart"></canvas>

        </div>

        <!-- Language Chart -->

        <div class="dashboard-card mt-5">

            <h4>
                Language Distribution
            </h4>

            <canvas id="languageChart"></canvas>

        </div>

    </main>

</div>

<script>

/* Accuracy Chart */

new Chart(

document.getElementById(
"accuracyChart"
),

{

type:"line",

data:{

labels:[
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat",
"Sun"
],

datasets:[{

label:"Accuracy %",

data:[
94,
95,
96,
97,
97,
98,
97
],

borderWidth:3

}]

}

});

/* Usage Chart */

new Chart(

document.getElementById(
"usageChart"
),

{

type:"bar",

data:{

labels:[
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat",
"Sun"
],

datasets:[{

label:"Documents",

data:[
120,
145,
160,
175,
180,
210,
190
]

}]

}

});

/* Language Distribution */

new Chart(

document.getElementById(
"languageChart"
),

{

type:"doughnut",

data:{

labels:[
"English",
"Telugu",
"Hindi"
],

datasets:[{

data:[
60,
25,
15
]

}]

}

});

</script>

</body>

</html>
