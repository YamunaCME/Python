<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Upload Image</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html"><i class="bi bi-house"></i> Dashboard</a></li>

            <li><a href="upload-image.html"><i class="bi bi-upload"></i> Upload Image</a></li>

            <li><a href="image-processing.html"><i class="bi bi-image"></i> Image Processing</a></li>

            <li><a href="ocr-recognition.html"><i class="bi bi-file-earmark-text"></i> OCR Recognition</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <h2 class="mb-4">
            Upload Handwritten Image
        </h2>

        <!-- Upload Area -->

        <div class="upload-box" id="dropArea">

            <i class="bi bi-cloud-arrow-up display-1"></i>

            <h4>
                Drag & Drop Image Here
            </h4>

            <p>
                or
            </p>

            <input
            type="file"
            id="fileInput"
            hidden
            accept=".jpg,.jpeg,.png,.bmp">

            <button
            class="btn btn-primary"
            onclick="document.getElementById('fileInput').click()">

            Browse File

            </button>

        </div>

        <!-- Preview -->

        <div class="preview-container mt-4">

            <img id="previewImage"
            class="img-fluid rounded shadow"
            style="display:none; max-height:400px;">

        </div>

        <!-- Progress -->

        <div class="progress mt-4">

            <div
            id="uploadProgress"
            class="progress-bar progress-bar-striped progress-bar-animated"
            style="width:0%">
            0%
            </div>

        </div>

        <!-- Actions -->

        <div class="mt-4">

            <button
            class="btn btn-success"
            id="uploadBtn">

            Upload Image

            </button>

            <a href="image-processing.html"
            class="btn btn-info">

            Next Step

            </a>

        </div>

    </main>

</div>

<script src="../js/upload.js"></script>

</body>
</html>
