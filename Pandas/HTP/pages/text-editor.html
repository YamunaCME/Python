<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Text Editor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="upload-image.html">Upload</a></li>
            <li><a href="ocr-recognition.html">OCR Recognition</a></li>
            <li><a href="text-editor.html">Text Editor</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            OCR Text Editor
        </h2>

        <!-- Search Replace -->

        <div class="dashboard-card mb-4">

            <div class="row">

                <div class="col-md-4">

                    <input
                    type="text"
                    id="searchText"
                    class="form-control"
                    placeholder="Search text">

                </div>

                <div class="col-md-4">

                    <input
                    type="text"
                    id="replaceText"
                    class="form-control"
                    placeholder="Replace with">

                </div>

                <div class="col-md-4">

                    <button
                    class="btn btn-warning"
                    onclick="replaceWord()">

                    Replace

                    </button>

                </div>

            </div>

        </div>

        <!-- Toolbar -->

        <div class="dashboard-card mb-3">

            <button class="btn btn-light" onclick="formatText('bold')">
                <b>B</b>
            </button>

            <button class="btn btn-light" onclick="formatText('italic')">
                <i>I</i>
            </button>

            <button class="btn btn-light" onclick="formatText('underline')">
                <u>U</u>
            </button>

        </div>

        <!-- Editor -->

        <div
        id="editor"
        contenteditable="true"
        class="form-control"
        style="height:300px; overflow:auto;">

This is OCR extracted text.

You can edit, correct spelling mistakes, remove unwanted content, and prepare text for translation or export.

        </div>

        <!-- Statistics -->

        <div class="row mt-4">

            <div class="col-md-6">

                <div class="dashboard-card text-center">

                    <h5>Characters</h5>

                    <h2 id="charCount">0</h2>

                </div>

            </div>

            <div class="col-md-6">

                <div class="dashboard-card text-center">

                    <h5>Words</h5>

                    <h2 id="wordCount">0</h2>

                </div>

            </div>

        </div>

        <!-- Actions -->

        <div class="mt-4">

            <button
            class="btn btn-success"
            onclick="copyEditorText()">

            Copy Text

            </button>

            <button
            class="btn btn-danger"
            onclick="clearEditor()">

            Clear

            </button>

            <button
            class="btn btn-primary"
            onclick="saveDraft()">

            Save Draft

            </button>

            <a
            href="translation.html"
            class="btn btn-info">

            Continue to Translation →

            </a>

        </div>

    </main>

</div>

<script>

const editor =
document.getElementById("editor");

function formatText(command){

document.execCommand(command,false,null);

}

function replaceWord(){

let search =
document.getElementById("searchText").value;

let replace =
document.getElementById("replaceText").value;

editor.innerHTML =
editor.innerHTML.replaceAll(search,replace);

updateCounts();

}

function copyEditorText(){

navigator.clipboard.writeText(
editor.innerText
);

alert("Text copied successfully");

}

function clearEditor(){

editor.innerHTML="";

updateCounts();

}

function saveDraft(){

localStorage.setItem(
"draftText",
editor.innerHTML
);

alert("Draft saved");

}

function updateCounts(){

const text =
editor.innerText;

document.getElementById(
"charCount"
).innerText =
text.length;

document.getElementById(
"wordCount"
).innerText =
text.trim().split(/\s+/).length;

}

editor.addEventListener(
"keyup",
updateCounts
);

updateCounts();

</script>

</body>

</html>
