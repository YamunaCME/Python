<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDF Recognition</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="upload-image.html">Upload</a></li>
            <li><a href="camera-recognition.html">Camera OCR</a></li>
            <li><a href="pdf-recognition.html">PDF OCR</a></li>
        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            PDF Recognition Module
        </h2>

        <!-- Upload PDF -->

        <div class="dashboard-card">

            <h4>Upload PDF File</h4>

            <input
            type="file"
            id="pdfFile"
            class="form-control"
            accept=".pdf">

        </div>

        <!-- PDF Preview -->

        <div class="dashboard-card mt-4">

            <h4>PDF Preview</h4>

            <div
            class="border rounded p-5 text-center">

                <i class="bi bi-file-earmark-pdf display-1 text-danger"></i>

                <p class="mt-3">
                    PDF Preview Area
                </p>

            </div>

            <!-- Navigation -->

            <div class="mt-3">

                <button
                class="btn btn-secondary"
                onclick="previousPage()">

                Previous

                </button>

                <span
                id="pageNumber"
                class="mx-3">

                Page 1

                </span>

                <button
                class="btn btn-secondary"
                onclick="nextPage()">

                Next

                </button>

            </div>

        </div>

        <!-- OCR Extraction -->

        <div class="dashboard-card mt-4">

            <h4>Extract Text</h4>

            <button
            class="btn btn-success"
            onclick="extractText()">

            Start OCR Extraction

            </button>

            <div
            id="pdfLoading"
            class="mt-3"
            style="display:none;">

                <div
                class="spinner-border text-info">
                </div>

                <p>
                    Extracting text...
                </p>

            </div>

        </div>

        <!-- OCR Output -->

        <div
        id="resultSection"
        class="dashboard-card mt-4"
        style="display:none;">

            <h4>Extracted Text</h4>

            <textarea
            id="pdfResult"
            rows="10"
            class="form-control">

            </textarea>

            <button
            class="btn btn-primary mt-3"
            onclick="downloadResult()">

            Download Text

            </button>

        </div>

        <div class="mt-4">

            <a
            href="text-editor.html"
            class="btn btn-info">

            Continue to Text Editor →

            </a>

        </div>

    </main>

</div>

<script>

let currentPage = 1;

function nextPage(){

currentPage++;

document.getElementById(
"pageNumber"
).innerText =
"Page " + currentPage;

}

function previousPage(){

if(currentPage > 1){

currentPage--;

}

document.getElementById(
"pageNumber"
).innerText =
"Page " + currentPage;

}

function extractText(){

document.getElementById(
"pdfLoading"
).style.display =
"block";

setTimeout(()=>{

document.getElementById(
"pdfLoading"
).style.display =
"none";

document.getElementById(
"resultSection"
).style.display =
"block";

document.getElementById(
"pdfResult"
).value =

"Sample text extracted from PDF.\n\nThis demonstrates OCR processing of uploaded PDF documents.";

},3000);

}

function downloadResult(){

const text =
document.getElementById(
"pdfResult"
).value;

const blob =
new Blob([text],
{type:"text/plain"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"pdf-ocr-result.txt";

link.click();

}

</script>

</body>

</html>
