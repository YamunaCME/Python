<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Camera Recognition</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>

            <li><a href="camera-recognition.html">Camera OCR</a></li>

            <li><a href="ocr-recognition.html">OCR Recognition</a></li>

            <li><a href="history.html">History</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <h2 class="mb-4">
            Real-Time Camera Recognition
        </h2>

        <div class="row">

            <!-- Camera -->

            <div class="col-lg-6">

                <div class="dashboard-card">

                    <h4>Camera Preview</h4>

                    <video
                    id="video"
                    width="100%"
                    autoplay
                    class="rounded">
                    </video>

                    <canvas
                    id="canvas"
                    style="display:none;">
                    </canvas>

                    <img
                    id="capturedImage"
                    class="img-fluid rounded mt-3"
                    style="display:none;">

                    <div class="mt-3">

                        <button
                        class="btn btn-primary"
                        onclick="captureImage()">

                        Capture

                        </button>

                        <button
                        class="btn btn-warning"
                        onclick="retakeImage()">

                        Retake

                        </button>

                    </div>

                </div>

            </div>

            <!-- OCR Panel -->

            <div class="col-lg-6">

                <div class="dashboard-card">

                    <h4>OCR Result</h4>

                    <button
                    class="btn btn-success mb-3"
                    onclick="recognizeText()">

                    Recognize Text

                    </button>

                    <div
                    id="ocrLoading"
                    style="display:none;">

                        <div
                        class="spinner-border text-info">
                        </div>

                        <p class="mt-2">
                            Processing...
                        </p>

                    </div>

                    <textarea
                    id="ocrOutput"
                    class="form-control"
                    rows="10">

Recognition result will appear here...

                    </textarea>

                    <div class="mt-3">

                        <span
                        class="badge bg-success">

                        Confidence: 97%

                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div class="mt-4">

            <a
            href="text-editor.html"
            class="btn btn-info">

            Continue →

            </a>

        </div>

    </main>

</div>

<script>

// Camera Access

const video =
document.getElementById("video");

navigator.mediaDevices
.getUserMedia({video:true})

.then(stream=>{

video.srcObject = stream;

})

.catch(err=>{

alert(
"Camera access denied"
);

});

// Capture

function captureImage(){

const canvas =
document.getElementById("canvas");

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0
);

const imageData =
canvas.toDataURL();

document.getElementById(
"capturedImage"
).src =
imageData;

document.getElementById(
"capturedImage"
).style.display =
"block";

video.style.display =
"none";

}

// Retake

function retakeImage(){

document.getElementById(
"capturedImage"
).style.display =
"none";

video.style.display =
"block";

}

// OCR Demo

function recognizeText(){

document.getElementById(
"ocrLoading"
).style.display =
"block";

setTimeout(()=>{

document.getElementById(
"ocrLoading"
).style.display =
"none";

document.getElementById(
"ocrOutput"
).value =

"Sample handwritten text recognized successfully.\n\nThis is a demo OCR output generated from camera capture.";

},2500);

}

</script>

</body>

</html>
