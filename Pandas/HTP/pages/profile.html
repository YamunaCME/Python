<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3 class="logo">HTR AI</h3>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="settings.html">Settings</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <h2 class="mb-4">
            User Profile
        </h2>

        <div class="row">

            <!-- Profile Picture -->

            <div class="col-lg-4">

                <div class="dashboard-card text-center">

                    <img
                    id="profilePreview"
                    src="https://via.placeholder.com/180"
                    class="rounded-circle img-fluid mb-3">

                    <input
                    type="file"
                    id="profileImage"
                    class="form-control">

                </div>

            </div>

            <!-- User Details -->

            <div class="col-lg-8">

                <div class="dashboard-card">

                    <h4>
                        Personal Information
                    </h4>

                    <div class="row">

                        <div class="col-md-6">

                            <label>Name</label>

                            <input
                            type="text"
                            class="form-control"
                            value="Yamuna">

                        </div>

                        <div class="col-md-6">

                            <label>Email</label>

                            <input
                            type="email"
                            class="form-control"
                            value="yamuna@example.com">

                        </div>

                    </div>

                    <div class="row mt-3">

                        <div class="col-md-6">

                            <label>Phone</label>

                            <input
                            type="text"
                            class="form-control"
                            value="+91 9876543210">

                        </div>

                        <div class="col-md-6">

                            <label>Organization</label>

                            <input
                            type="text"
                            class="form-control"
                            value="College Project">

                        </div>

                    </div>

                    <button
                    class="btn btn-primary mt-4">

                    Save Profile

                    </button>

                </div>

            </div>

        </div>

        <!-- Change Password -->

        <div class="dashboard-card mt-4">

            <h4>
                Change Password
            </h4>

            <div class="row">

                <div class="col-md-4">

                    <input
                    type="password"
                    class="form-control"
                    placeholder="Current Password">

                </div>

                <div class="col-md-4">

                    <input
                    type="password"
                    class="form-control"
                    placeholder="New Password">

                </div>

                <div class="col-md-4">

                    <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm Password">

                </div>

            </div>

            <button
            class="btn btn-success mt-3">

            Update Password

            </button>

        </div>

    </main>

</div>

<script>

document.getElementById(
"profileImage"
).addEventListener("change",

function(event){

const reader =
new FileReader();

reader.onload = function(){

document.getElementById(
"profilePreview"
).src =
reader.result;

};

reader.readAsDataURL(
event.target.files[0]
);

});

</script>

</body>

</html>
